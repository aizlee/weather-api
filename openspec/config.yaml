schema: spec-driven

context: |
  Project: weather-api, a Laravel web application.
  Runtime: PHP 8.5 and Laravel Framework 13.42.0.
  Backend: Laravel 13 with Inertia Laravel 3.7, Fortify 1.42, Wayfinder 0.1.23,
    Tinker 3.1, and Laravel Boost 2.10.4.
  Frontend: React 19 with Inertia React, TypeScript, Tailwind CSS 4, Vite Plus,
    and Laravel Wayfinder generated actions and routes.
  Data: SQLite is the default database. Cache, queue, and session use the
    database by default. Database migrations and seeders live in database/.
  Authentication: Fortify-backed authentication with registration, login,
    email verification, password reset, two-factor authentication, passkeys,
    and profile/security settings.
  Testing and quality: PHPUnit 12, Laravel Pint 1.32, and Larastan 3.15.
    Use the existing Composer scripts for build, lint, type checks, and tests.
  Architecture: Server-side Laravel routes and controllers render Inertia pages
    in resources/js/pages. Use Laravel actions and named routes through
    Wayfinder-generated TypeScript APIs where applicable.
  Business logic: Put orchestration, transformations, and domain rules in
    app/Services. Put external API clients and provider adapters in
    app/APIClients, define their contracts in app/Contracts, and bind concrete
    implementations in AppServiceProvider. Keep controllers, routes, form
    requests, and UI adapters thin. Group API routes by controller with
    Route::controller(...)->group(...) and use explicit controller methods.
    API clients normalize provider payloads into dedicated DTOs instead of
    exposing raw response arrays to services.
    Configuration defaults belong in config/services.php; clients may assume
    declared configuration keys exist and must not duplicate their existence
    checks or fallback values. Validate runtime credentials such as an empty
    API key when the configuration explicitly allows an empty environment
    value.
    API controller responses use dedicated JsonResource classes created with
    Resource::make(...). Resources list response fields explicitly and do not
    pass through the entire service array; controllers do not return raw
    response()->json(...) payloads. Services form response data through
    dedicated DTOs, and resources adapt those DTOs to the HTTP contract.
    Calls with more than one argument are written across multiple lines and
    use named arguments.
    User-facing text and API response messages must always be defined in
    Laravel translation files and retrieved through localization helpers such
    as __() or trans(). Do not hard-code these texts in controllers, services,
    resources, exceptions, form requests, or other application code.
    Prefer Laravel's built-in framework
    features and conventions over custom wrappers or redundant methods;
    introduce project-specific abstractions only when the framework solution
    is insufficient or a clear domain requirement justifies them.
  Deployment: Laravel Sail runs the PHP 8.5 application in compose.yaml and
    includes a Mailpit service. SQLite remains the default database; no external
    database container is required.
  Existing project support: Laravel Boost guidelines are in AGENTS.md. OpenSpec
    planning files live under openspec/.

rules:
  proposal:
    - Describe the user outcome, scope, non-goals, and acceptance criteria.
    - Ground the proposal in the current Laravel, Inertia, React, and SQLite stack.
    - Call out changes that affect authentication, database schema, routes, or deployment.
  specs:
    - Write requirements using SHALL statements.
    - Add concrete WHEN/THEN scenarios for normal, validation, authorization, and failure paths where applicable.
    - Preserve existing authentication and Inertia behavior unless the change explicitly modifies it.
  design:
    - Explain the Laravel backend, Inertia/React frontend, database, and deployment impact separately when they are involved.
    - Prefer existing application structure, Laravel conventions, named routes, and Wayfinder-generated client APIs.
    - Prefer ready-made Laravel solutions over redundant custom methods, wrappers, or abstractions unless a concrete limitation or domain requirement is documented.
    - Reflect the project conventions for Services, DTO-based response data, controller-grouped routes, and explicit JsonResource responses in the design.
    - Require Laravel translation files for all user-facing text and API response messages.
    - Identify migration, rollback, compatibility, and security considerations for persistent or authenticated features.
  tasks:
    - Group implementation work by backend, frontend, database, configuration, and tests.
    - Include the concrete Laravel Artisan, Composer, npm, and verification commands needed to complete the work.
    - Include resource creation and response-contract tests for API response changes.
    - Include translation-file updates whenever user-facing text or API response messages are added or changed.
    - Add tests for behavior changes and keep tasks small enough to implement and review independently.
